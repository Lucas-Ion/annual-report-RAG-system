[project]
name = "rag-system"
version = "0.1.0"
description = "RAG over annual reports"
requires-python = ">=3.13"
dependencies = [
    "pymupdf>=1.24.0",
    "docling>=2.0.0",
    "sqlite-vec>=0.1.6",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "sentence-transformers>=3.0.0",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["app", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
