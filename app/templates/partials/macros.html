{% macro page_link(document_id, page, style='badge') -%}
  <a class="page-link {{ 'badge' if style == 'badge' }}"
     {% if style == 'badge' %}data-variant="secondary"{% endif %}
     target="_blank" rel="noopener"
     href="/documents/{{ document_id }}/pdf#page={{ page }}"
     title="Open the report at page {{ page }}">p{{ page }}<svg
       xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
       stroke-linejoin="round" aria-hidden="true"
      ><path d="M14 3h7v7M21 3l-9 9M19 14v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h6"/></svg></a>
{%- endmacro %}
