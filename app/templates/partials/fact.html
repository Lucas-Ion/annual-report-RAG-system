{% from "partials/macros.html" import page_link %}

<li class="fact">
  <div class="fact-head">
    <span class="fact-value">{{ fact.value_raw }}</span>
    {% if fact.unit %}<span class="badge" data-variant="outline">{{ fact.unit }}</span>{% endif %}
    {{ page_link(fact.document_id, fact.page_no) }}
    {% if fact.confidence is not none %}
      <span class="badge conf {{ '' if fact.confidence >= 0.7 else 'low' }}" data-variant="outline"
            title="Model confidence">{{ '%.2f'|format(fact.confidence) }}</span>
    {% endif %}
  </div>
  <blockquote class="quote">{{ fact.verbatim_quote }}</blockquote>
</li>
